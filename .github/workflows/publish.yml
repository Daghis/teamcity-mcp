name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_registry:
        description: 'Force MCP registry publish without npm release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write # for npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@11.9.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Read package version
        id: pkg
        run: |
          node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Check if version already exists on npm
        id: exists
        run: |
          set -e
          PKG_NAME=$(node -p -e "require('./package.json').name")
          VERSION=${{ steps.pkg.outputs.version }}
          if npm view "${PKG_NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already published for ${PKG_NAME}; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} not found on registry; will publish."
          fi

      - name: Publish to npm
        if: steps.exists.outputs.exists == 'false'
        run: npm publish --access public --provenance

      - name: Install MCP Publisher
        if: steps.exists.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_registry == 'true')
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.6/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Login to MCP Registry
        if: steps.exists.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_registry == 'true')
        run: ./mcp-publisher login github-oidc

      # npm can take a couple of minutes to serve a freshly published version, and
      # the MCP Registry rejects a package version it cannot see yet. Retry only that
      # rejection; any other failure is fatal. Registry tokens expire after five
      # minutes, so log in again before each retry.
      - name: Publish to MCP Registry
        if: steps.exists.outputs.exists == 'false' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_registry == 'true')
        run: |
          MAX_ATTEMPTS=20
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if [ "$attempt" -gt 1 ]; then
              sleep 30
              ./mcp-publisher login github-oidc
            fi
            if output=$(./mcp-publisher publish 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if ! grep -q "was not found" <<< "$output"; then
              exit 1
            fi
            echo "npm is not serving this version yet (attempt ${attempt}/${MAX_ATTEMPTS})"
          done
          echo "::error::npm still was not serving the new version after ${MAX_ATTEMPTS} attempts"
          exit 1
